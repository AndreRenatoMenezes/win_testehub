name: Novo teste ou melhoria
description: Propor um novo módulo de teste, um script de setup ou uma melhoria no hub.
labels: ["enhancement"]
body:
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo
      options:
        - Novo módulo de teste
        - Novo script de setup
        - Melhoria no hub
        - Relatórios
        - Documentação
    validations:
      required: true

  - type: textarea
    id: problema
    attributes:
      label: Qual problema isso resolve
    validations:
      required: true

  - type: textarea
    id: proposta
    attributes:
      label: Proposta
      description: Para um novo teste, descreva o que medir, a ferramenta, a duração e o critério de PASS/FAIL.

  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas consideradas
